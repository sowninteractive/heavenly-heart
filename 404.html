<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Words of Life</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(#e8d7ff, #ffd6e0 55%, #fffdf9);
        color: #3a2a28;
        font-family: Nunito, system-ui, sans-serif;
        text-align: center;
      }
      main {
        padding: 2rem;
      }
      a {
        color: #9d3458;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This path is quiet.</h1>
      <p>The words are on the home page.</p>
      <p><a id="home" href="/">Return home</a></p>
    </main>
    <script>
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        if (parts.length) parts.pop();
        var home = document.getElementById("home");
        home.setAttribute("href", "/" + parts.join("/") + (parts.length ? "/" : ""));
      })();
    </script>
  </body>
</html>
